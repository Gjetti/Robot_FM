# =============================================================================
# Structured Transformer Q-critic training
# =============================================================================

seed: 42

dataset:
  # Row-level rollout CSV. Only rows with is_decision_row == True are used.
  row_csv: /home/georges/BoxPushingProject/source/georges_ext/georges_ext/tasks/locomotion/georges_v0/all_rollouts_50hz_july17_downsampled_5hz_july17_with_rewards.csv

  # One row per planner segment. reward_total is used to compute the
  # Monte Carlo discounted return-to-go target.
  segment_csv: /home/georges/BoxPushingProject/source/georges_ext/georges_ext/tasks/locomotion/georges_v0/all_rollouts_50hz_july17_downsampled_5hz_july17_decision_segments_with_rewards.csv

  # Original synthetic trajectories used to recover object movable flags.
  base_csv: /home/georges/Go2SDK-main/example/go2/low_level/collected_demos_for_physics_rollouts_filtered_july6.csv

  max_objects: 6
  gamma: 0.99
  eval_ratio: 0.10
  num_workers: 0

model:
  d_model: 256
  num_heads: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.10

  robot_state_dim: 37
  object_feature_dim: 13

  num_skills: 2
  max_object_id: 6

  room_x_limit: 1.5
  room_y_limit: 2.5

  object_physical_dim: 224
  object_id_embedding_dim: 32

training:
  device: auto

  epochs: 100
  batch_size: 64
  gradient_accumulation_steps: 1

  learning_rate: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  epsilon: 1.0e-8

  # Huber is less sensitive than MSE to unusually large target errors.
  loss: huber
  huber_delta: 1.0

  max_grad_norm: 1.0

  # fp32, fp16, or bf16. On CPU this automatically runs as fp32.
  precision: bf16

  logging_steps: 10
  evaluation_every_epochs: 1
  save_every_epochs: 1

  # Set to a checkpoint path to resume, or leave null.
  resume_from: null

scheduler:
  name: cosine
  warmup_ratio: 0.05
  minimum_lr_ratio: 0.10

evaluation:
  # Direct test of whether predicted Q values rank returns correctly.
  ranking_max_pairs: 100000
  ranking_tie_tolerance: 1.0e-6

output:
  run_name: structured_q_critic
  checkpoint_root: checkpoints/critic
  save_total_limit: 4
